spring.application.name=groupware
spring.config.import=optional:file:./config/application-local.properties
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/Groupware
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@//localhost:1522/ORCLPDB1}
spring.datasource.username=${ORACLE_USERNAME:GROUPWARE_BOOT}
spring.datasource.password=${ORACLE_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.connection-init-sql=ALTER SESSION SET TIME_ZONE = '+09:00'
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
spring.messages.basename=resources.message
spring.messages.encoding=UTF-8
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
spring.sql.init.mode=never
app.upload-dir=${GROUPWARE_UPLOAD_DIR:./data/uploads/board}
